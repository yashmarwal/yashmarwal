<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="robots" content="noindex"/>
  <title>Page not found — Yash Marwal</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml"/>
  <link rel="stylesheet" href="/css/fonts.css"/>
  <style>
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#f4eee1;color:#000;font-family:'Space Mono',monospace;padding:24px}
    main{max-width:640px;width:100%;border:2px solid #000;padding:40px 32px;text-align:center}
    .kicker{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:#c7343a;font-weight:700}
    h1{font-family:'Newsreader',Georgia,serif;font-weight:500;font-size:clamp(44px,12vw,84px);line-height:1;margin:14px 0 6px;text-transform:uppercase;letter-spacing:-.02em}
    .rule{height:2px;background:#000;margin:18px 0 3px}.rule2{height:1px;background:#000;margin-bottom:22px}
    p{font-family:'Newsreader',Georgia,serif;font-style:italic;font-size:22px;color:#635d5b;margin:0 0 26px}
    a{display:inline-block;background:#000;color:#fff;text-decoration:none;padding:12px 22px;font-size:12px;letter-spacing:.08em;font-weight:700;text-transform:uppercase}
    a:hover{background:#635d5b}
  </style>
</head>
<body>
  <main>
    <div class="kicker">Error 404 • Page not found</div>
    <h1>Not on this page</h1>
    <div class="rule"></div><div class="rule2"></div>
    <p>The page you asked for isn't in this edition.</p>
    <a href="/">Back to the front page →</a>
  </main>
</body>
</html>
