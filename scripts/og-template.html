<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=Space+Mono:wght@400;700&family=Libre+Franklin:wght@700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{width:1200px;height:627px;background:#f4eee1;color:#000;font-family:'Space Mono',monospace;position:relative;overflow:hidden}
  .frame{position:absolute;inset:24px;border:2px solid #000;padding:34px 48px}
  .top{display:flex;justify-content:space-between;font-size:17px;letter-spacing:.08em;text-transform:uppercase;color:#444}
  .top b{color:#000}
  h1{font-family:'Newsreader',serif;font-weight:500;font-size:132px;line-height:1;white-space:nowrap;letter-spacing:-.025em;text-transform:uppercase;text-align:center;margin-top:18px}
  .rule1{height:2px;background:#000;margin-top:14px}
  .rule2{height:1px;background:#000;margin-top:3px}
  .kicker{margin-top:28px;display:flex;align-items:center;gap:12px;font-family:'Libre Franklin',sans-serif;font-weight:700;font-size:19px;letter-spacing:.14em;text-transform:uppercase;color:#ed4748}
  .kicker i{width:11px;height:11px;background:#ed4748;display:inline-block}
  .headline{white-space:nowrap;font-family:"Newsreader",serif;font-size:46px;line-height:1.08;margin-top:12px;max-width:980px;letter-spacing:-.01em}
  .foot{position:absolute;left:48px;right:48px;bottom:30px;display:flex;justify-content:space-between;align-items:baseline;border-top:1px solid #000;padding-top:14px;font-size:19px;letter-spacing:.06em;text-transform:uppercase}
  .foot b{font-weight:700}
</style></head><body>
<div class="frame">
  <div class="top"><span><b>Delhi, India</b> &nbsp;•&nbsp; Founder Edition &nbsp;•&nbsp; Vol. 01</span><span>Entrepreneur &amp; Founder</span></div>
  <h1>Yash Marwal</h1>
  <div class="rule1"></div><div class="rule2"></div>
  <div class="kicker"><i></i>Lead Story • The Founder's Desk</div>
  <div class="headline">An entrepreneur modernising Indian B2B businesses.</div>
  <div class="foot"><b>Phaseline · Optimeta · Banao&nbsp;Buzz</b><span>yashmarwal.pages.dev</span></div>
</div>
</body></html>
