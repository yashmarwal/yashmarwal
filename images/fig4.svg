<text x="92" y="394" font-family="Georgia, 'Times New Roman', serif" font-size="19" font-weight="400" font-style="italic" fill="#555555" text-anchor="start" letter-spacing="0">A custom online presence built</text><text x="92" y="428" font-family="Georgia, 'Times New Roman', serif" font-size="19" font-weight="400" font-style="italic" fill="#555555" text-anchor="start" letter-spacing="0">around the brand, not a template.</text><text x="92" y="462" font-family="Georgia, 'Times New Roman', serif" font-size="19" font-weight="400" font-style="italic" fill="#555555" text-anchor="start" letter-spacing="0">Enquiries reach WhatsApp and email.</text><rect x="456" y="226" width="368" height="300" fill="#fff" stroke="#000000" stroke-width="1.5"/>
<text x="484" y="274" font-family="'Courier New', Courier, monospace" font-size="15" font-weight="700"  fill="#000000" text-anchor="start" letter-spacing="3">02  •  OPERATIONS</text>
<text x="484" y="330" font-family="Georgia, 'Times New Roman', serif" font-size="26" font-weight="700"  fill="#000000" text-anchor="start" letter-spacing="0">Business Systems</text>
<rect x="484" y="352" width="312" height="1.5" fill="#bdbdbd"/>
<text x="484" y="394" font-family="Georgia, 'Times New Roman', serif" font-size="19" font-weight="400" font-style="italic" fill="#555555" text-anchor="start" letter-spacing="0">A private operations platform that</text><text x="484" y="428" font-family="Georgia, 'Times New Roman', serif" font-size="19" font-weight="400" font-style="italic" fill="#555555" text-anchor="start" letter-spacing="0">replaces registers and chat threads:</text><text x="484" y="462" font-family="Georgia, 'Times New Roman', serif" font-size="19" font-weight="400" font-style="italic" fill="#555555" text-anchor="start" letter-spacing="0">admin panel, records, reminders.</text><rect x="848" y="226" width="368" height="300" fill="#000000" stroke="#000000" stroke-width="1.5"/>
<text x="876" y="274" font-family="'Courier New', Courier, monospace" font-size="15" font-weight="700"  fill="#fff" text-anchor="start" letter-spacing="3">03  •  TAILORED</text>
<text x="876" y="330" font-family="Georgia, 'Times New Roman', serif" font-size="26" font-weight="700"  fill="#fff" text-anchor="start" letter-spacing="0">Custom Software &amp; AI</text>
<rect x="876" y="352" width="312" height="1.5" fill="#777"/>
<text x="876" y="394" font-family="Georgia, 'Times New Roman', serif" font-size="19" font-weight="400" font-style="italic" fill="#ddd" text-anchor="start" letter-spacing="0">Software built for one specific</text><text x="876" y="428" font-family="Georgia, 'Times New Roman', serif" font-size="19" font-weight="400" font-style="italic" fill="#ddd" text-anchor="start" letter-spacing="0">problem, with AI where it adds</text><text x="876" y="462" font-family="Georgia, 'Times New Roman', serif" font-size="19" font-weight="400" font-style="italic" fill="#ddd" text-anchor="start" letter-spacing="0">real value. You own code and data.</text><text x="64" y="570" font-family="'Courier New', Courier, monospace" font-size="15" font-weight="700"  fill="#000000" text-anchor="start" letter-spacing="3">HOW A PROJECT RUNS</text><rect x="64" y="590" width="208" height="72" fill="#fff" stroke="#000000" stroke-width="1.5"/>
